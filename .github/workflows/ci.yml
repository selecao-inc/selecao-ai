name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 指示ファイルは AGENTS.md だけ。CLAUDE.md があると Claude Code は AGENTS.md を読まなくなり、
      # Codex など他のツールと別の指示で動いてしまうため、紛れ込んだら失敗させる
      - name: AGENTS.md 以外のエージェント指示ファイルが無いこと
        run: |
          # -z で NUL 区切り・引用なしのパスを受け取る（既定では日本語などのパスが "..." で囲まれ、ファイル名で判定できない）
          shopt -s nocasematch
          found=""
          while IFS= read -r -d '' path; do
            case "${path##*/}" in
              claude.md|claude.local.md|codex.md|gemini.md|.cursorrules) found+="$path"$'\n' ;;
            esac
          done < <(git ls-files -z)
          if [ -n "$found" ]; then
            echo "::error::AGENTS.md 以外のエージェント指示ファイルがあります。内容を AGENTS.md に統合して削除してください"
            printf '%s' "$found"
            exit 1
          fi

      # pnpm の版は package.json の packageManager を単一ソースにする
      # （action 側に version を書くと ERR_PNPM_BAD_PM_VERSION になる）
      - uses: pnpm/action-setup@v6

      # Node の版は package.json の engines.node を単一ソースにする
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
