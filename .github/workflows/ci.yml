name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm の版は package.json の packageManager を単一ソースにする
      # （action 側に version を書くと ERR_PNPM_BAD_PM_VERSION になる）
      - uses: pnpm/action-setup@v4

      # Node の版は package.json の engines.node を単一ソースにする
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
