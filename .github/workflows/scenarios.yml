name: scenarios

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: scenarios-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      deployments: read
    outputs:
      preview: ${{ steps.plan.outputs.preview }}
      vitest: ${{ steps.plan.outputs.vitest }}
      origin: ${{ steps.plan.outputs.origin }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          path: .scenario-work/subject
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - id: plan
        # PR のコードではなく base 側の runner で判定する。
        run: node .github/scripts/scenario-runner.mts plan .scenario-work/subject .scenario-work/plan.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v6
        with:
          name: scenario-plan
          path: .scenario-work/plan.json
          include-hidden-files: true
          if-no-files-found: error

  vitest:
    needs: plan
    if: needs.plan.outputs.vitest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          path: .scenario-work/subject
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      # head の install・コードを実行する job には bypass などの secrets を渡さない。
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .scenario-work/subject
      - uses: actions/download-artifact@v7
        with:
          name: scenario-plan
          path: .scenario-work
      - run: node .github/scripts/scenario-runner.mts run .scenario-work/subject .scenario-work/plan.json vitest .scenario-work/vitest.json
      - uses: actions/upload-artifact@v6
        with:
          name: scenario-result-vitest
          path: .scenario-work/vitest.json
          include-hidden-files: true
          if-no-files-found: error

  preview:
    needs: plan
    if: needs.plan.outputs.preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          path: .scenario-work/subject
          # この checkout はテスト本文を読むためだけに使用する。
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      # base の固定依存だけを使う。head の install・設定は実行しない。
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          name: scenario-plan
          path: .scenario-work
      - run: node .github/scripts/scenario-runner.mts run .scenario-work/subject .scenario-work/plan.json preview .scenario-work/preview.json
        env:
          PREVIEW_ORIGIN: ${{ needs.plan.outputs.origin }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v6
        with:
          name: scenario-result-preview
          path: .scenario-work/preview.json
          include-hidden-files: true
          if-no-files-found: error

  scenarios:
    if: always()
    needs: [plan, vitest, preview]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 必要な job の完了を確認
        env:
          PLAN: ${{ needs.plan.result }}
          VITEST: ${{ needs.vitest.result }}
          PREVIEW: ${{ needs.preview.result }}
        run: |
          test "$PLAN" = success
          test "$VITEST" = success -o "$VITEST" = skipped
          test "$PREVIEW" = success -o "$PREVIEW" = skipped
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v7
        with:
          name: scenario-plan
          path: .scenario-work
      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.preview == 'true' || needs.plan.outputs.vitest == 'true'
        with:
          pattern: scenario-result-*
          merge-multiple: true
          path: .scenario-work/results
      - run: node .github/scripts/scenario-runner.mts judge .scenario-work/plan.json .scenario-work/results
