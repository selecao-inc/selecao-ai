version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    labels: [dependencies]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    labels: [dependencies]
